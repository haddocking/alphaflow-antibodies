run_dir = "af2antigen-AFL-Para-Epi-full-1000-200"
mode = "local"
ncores = 24
clean = true
molecules =  [
    "ensemble_7msq_emref.pdb",
    "7msq_af2_antigen_haddock-ready.pdb"
    ]
[topoaa]
[rigidbody]
# ambig restraints
ambig_fname = "7msq_ambig_Para_Epi.tbl"
# Restraints to keep the antibody chains together
unambig_fname = "7msq_unambig_af2_AF2.tbl"

sampling = 1000
[caprieval]
reference_fname = "7msq_target.pdb"
[seletop]
select = 200
[flexref]
tolerance = 20
ambig_fname = "7msq_ambig_Para_Epi.tbl"
unambig_fname = "7msq_unambig_af2_AF2.tbl"
[emref]
tolerance = 5
ambig_fname = "7msq_ambig_Para_Epi.tbl"
unambig_fname = "7msq_unambig_af2_AF2.tbl"
[caprieval]
reference_fname = "7msq_target.pdb"
[clustfcc]
min_population=4
[caprieval]
reference_fname = "7msq_target.pdb"

